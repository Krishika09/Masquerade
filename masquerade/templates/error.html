{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px; margin:60px auto">
  <div class="card-h"><h3>Error {{ code }}</h3></div>
  <div class="card-b">
    <h2 style="font-size:22px; margin-bottom:8px">{{ title }}</h2>
    <p class="dim">{{ message }}</p>
    <a class="btn primary" href="{{ url_for('main.index') }}">Back to upload</a>
  </div>
</div>
{% endblock %}
